# Team1 edge — Phase 2 (mac2-primary)
worker_processes 1;
error_log /opt/homebrew/var/log/nginx/error.log;
pid       /opt/homebrew/var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    # which edge + which backend served every request
    log_format edge '$time_local $remote_addr "$request" $status '
                    'upstream=$upstream_addr ustatus=$upstream_status rt=$request_time';
    access_log /opt/homebrew/var/log/nginx/team1_access.log edge;

    # Phase 2 Ext D: passive health checks.
    # One failed connect/timeout marks a backend down for 10s; nginx retries
    # the request on the other backend, so clients never see the failure.
    upstream app_backends {
        server 10.7.2.169:3001  max_fails=1 fail_timeout=10s;   # Backend A (Mac 3)
        server 10.7.27.127:3002 max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate     /Users/PalakNst/phase1/TLS/app.team1.test.crt;
        ssl_certificate_key /Users/PalakNst/phase1/TLS/app.team1.test.key;
        ssl_protocols TLSv1.2;

        add_header X-Edge mac2-primary always;

        location / {
            proxy_pass http://app_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
