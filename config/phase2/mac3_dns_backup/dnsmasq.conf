# Team1 private DNS — BACKUP (Mac 3) — same records as primary
port=53
listen-address=10.7.2.169,127.0.0.1
bind-interfaces

domain-needed
bogus-priv

# upstream for non-project names (avoid looping through ourselves)
no-resolv
server=10.5.7.1
server=8.8.8.8

# project records -> edge (Mac 2 nginx)
address=/app.team1.test/10.7.6.248
address=/api.team1.test/10.7.6.248

# Phase 2 Ext B: short, visible TTL on our records
local-ttl=30

cache-size=100
log-queries
log-facility=/Users/SamarthPersonal/phase2/DNS-backup/dnsmasq.log
