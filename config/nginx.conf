events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream app_backends {
        server 10.7.10.160:3001;
        server 10.7.9.47:3002;
    }

    server {
        listen 8443 ssl;
        server_name app.team1.test api.team1.test;

        ssl_certificate     /Users/PalakNst/phase1/TLS/app.team1.test.crt;
        ssl_certificate_key /Users/PalakNst/phase1/TLS/app.team1.test.key;

        ssl_protocols TLSv1.2;

        location / {
            proxy_pass http://app_backends;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
